# netlify.toml
# ═══════════════════════════════════════════════════════════════
# Window Hero — Netlify Configuration
# Place this file in the root of each location's deployment folder
# ═══════════════════════════════════════════════════════════════

[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
